name: check

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:ci
      - name: Exercise updater activation and rollback
        run: sudo tests/updater-integration.sh

  visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:visual
      - name: Preserve visual failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-failure
          path: test-results/
          retention-days: 7
